backend:
name: git-gateway
branch: main

media_folder: "images"
public_folder: "/images"

collections:

* name: "pages"
  label: "Páginas"
  files:

  * file: "index.html"
    label: "Inicio"
    name: "home"
    fields:

    * { label: "Contenido", name: "body", widget: "markdown" }

* name: "blog"
  label: "Blog"
  folder: "blog"
  create: true
  slug: "{{slug}}"
  fields:

  * { label: "Título", name: "title", widget: "string" }
  * { label: "Texto", name: "body", widget: "markdown" }
